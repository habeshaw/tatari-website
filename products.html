<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TATARI Store — Certified Templates & Business Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="products">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-icon">T</span><span><b>TATARI</b><small>DIGITAL STORE</small></span></a>
    <button class="mobile-menu" id="mobileMenu" type="button">☰</button>
    <nav id="nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="index.html#consulting" data-i18n="nav_consulting">Consulting</a>
      <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
      <a href="freelance.html" data-i18n="nav_freelance">Freelance</a>
      <a href="products.html" class="active-link" data-i18n="nav_store">Store</a>
      <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
    </nav>
    <div class="head-actions">
      <div class="lang-switch">
        <button class="lang-btn active" id="langEN" type="button">EN</button>
        <button class="lang-btn" id="langAM" type="button">አማ</button>
      </div>
      <button class="btn btn-primary btn-small" id="openAddProductModalBtn" type="button" data-i18n="btn_sell_product">+ List a Product (Telebirr)</button>
      <button class="btn btn-outline btn-small" id="accountBtn" type="button" data-i18n="btn_login">Login / Sign Up</button>
      <button class="btn btn-outline btn-small" id="logoutBtn" hidden type="button" data-i18n="btn_logout">Logout</button>
    </div>
  </header>

  <main class="section">
    <div class="section-head">
      <div>
        <div class="section-label" data-i18n="store_eyebrow">ETHIOPIAN DIGITAL & BUSINESS PRODUCT STORE</div>
        <h1 style="font-size:36px; margin:8px 0;" data-i18n="store_title">Certified Templates, <em>Payroll Systems & Toolkits</em></h1>
      </div>
    </div>

    <div class="search-filter-box">
      <div class="filter-grid" style="grid-template-columns: 2fr 1fr 1fr;">
        <div class="field">
          <label for="productFilterKeyword">Search Product / Template</label>
          <input id="productFilterKeyword" placeholder="Search Power Query payroll, KPI dashboards, HR policy packs..."/>
        </div>
        <div class="field">
          <label for="productFilterCategory" data-i18n="lbl_category">Category</label>
          <select id="productFilterCategory">
            <option value="all" data-i18n="opt_all_sectors">All Categories</option>
            <option value="Payroll & HR">Payroll & HR</option>
            <option value="BI Dashboards">BI Dashboards</option>
            <option value="Financial Models">Financial Models</option>
            <option value="Legal & Compliance">Legal & Compliance</option>
          </select>
        </div>
        <div class="field">
          <label for="productFilterMaxPrice">Max Price (ETB)</label>
          <input id="productFilterMaxPrice" type="number" min="0" placeholder="e.g. 5000"/>
        </div>
      </div>
    </div>

    <div class="catalog-grid" id="productsGrid">
      <div class="empty" data-i18n="loading_opportunities">Loading store products...</div>
    </div>
  </main>

  <div id="modalRoot"></div>
  <div id="toast" role="status"></div>

  <script src="supabase-config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
